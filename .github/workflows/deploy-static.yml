name: Deploy static project

on:
  workflow_call:
    inputs:
      project_slug:
        required: true
        type: string
      aws_region:
        required: false
        type: string
        default: us-west-2
      bucket_name:
        required: true
        type: string
      distribution_id:
        required: true
        type: string
      build_command:
        required: false
        type: string
        default: npm run build
      artifact_directory:
        required: false
        type: string
        default: dist
      health_url:
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.project_slug }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ inputs.build_command }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
      - name: Upload immutable release
        run: aws s3 sync "${{ inputs.artifact_directory }}" "s3://${{ inputs.bucket_name }}/releases/${{ github.sha }}" --delete
      - name: Publish release
        run: aws s3 sync "s3://${{ inputs.bucket_name }}/releases/${{ github.sha }}" "s3://${{ inputs.bucket_name }}/current" --delete
      - name: Invalidate edge cache
        run: aws cloudfront create-invalidation --distribution-id "${{ inputs.distribution_id }}" --paths "/*"
      - name: Check deployment health
        run: curl --fail --retry 6 --retry-delay 10 --retry-all-errors "${{ inputs.health_url }}"
      - name: Record deployment result
        if: always()
        run: |
          echo "## ${{ inputs.project_slug }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- revision: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- result: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
